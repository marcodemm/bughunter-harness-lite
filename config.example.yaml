# bughunter-harness-lite — sample config
# Copy this file to `config.yaml` and edit the fields you need.

# ─────────── LLM backend ─────────────────────────────────────────────
# `servertype: auto` auto-probes 127.0.0.1:11434 (Ollama), :1234 (LM Studio)
# and :8080 (Llama.cpp) in that order and uses the first one that answers.
# For cloud backends set servertype explicitly (openai / anthropic / gemini
# / nvidia) and either put api_key here OR set api_key_env to the env var
# name and export it before running.
llm:
  servertype: auto              # auto | ollama | lmstudio | llamacpp | openai | anthropic | gemini | nvidia
  base_url: ""                  # blank = default for that servertype
  api_key: ""                   # blank on local backends; use api_key_env for cloud
  api_key_env: ""               # e.g. OPENAI_API_KEY

  # The model id EXACTLY as your backend serves it. For Ollama with a custom
  # Modelfile this is the name you gave to `ollama create <name> -f ...`.
  model: "bughunter-v9"

  temperature: 0.1
  max_tokens: 1024
  timeout_sec: 300              # HTTP timeout on the /chat/completions call

# ─────────── Rate limit (global, enforced in code) ───────────────────
# Every tool call (http_get / http_post / run_shell) blocks until this many
# seconds have elapsed since the previous call. Keep it >= 1.0 on mobile —
# you do not want to burn battery AND the target's WAF quota.
throttle:
  min_interval_sec: 1.0

# ─────────── Session limits (kill switches) ──────────────────────────
limits:
  max_iterations: 20                    # hard stop for one-shot mode
  max_iterations_per_repl_turn: 4       # per user message in REPL
  max_wall_time_sec: 1500               # hard stop at 25 minutes
  shell_timeout_sec: 600                # per-command cap for run_shell
                                        # (10 min). wpscan with the
                                        # timeout-hardened flags
                                        # (--enumerate vp -t 5
                                        # --request-timeout 20
                                        # --connect-timeout 10) plus
                                        # nuclei -id runs typically fit
                                        # in 60-450s on ARM chroot / Mac.
                                        # Bump higher if you plan to run
                                        # wpscan --enumerate ap (all
                                        # plugins) or nuclei bulk tag
                                        # scans; lower it if you want
                                        # tighter iteration budgets.
  http_timeout_sec: 20                  # per-request cap for http_get/post

# ─────────── Pre-flight target reachability ──────────────────────────
# One HTTP probe before the agent loop starts. Modes:
#   strict: false → soft warn + continue (WAF may drop python-requests
#                   but agent tools might still pass with different UA)
#   strict: true  → abort on any probe failure
# NOTE: even with strict:false, the run ABORTS on markers that never
# recover: invalid URL, DNS NXDOMAIN, Connection refused, No route to host.
# (Same design as the desktop harness — ConnectTimeout stays soft.)
preflight:
  strict: false
  timeout_sec: 10

# ─────────── Scope enforcement policy ────────────────────────────────
# How strict is the scope check on every http_get / http_post / run_shell?
#   strict → out-of-scope host = ERROR, tool refuses. Default for real
#            bug-bounty engagements where "in-scope only" is non-
#            negotiable.
#   warn   → out-of-scope host = [WARN …] prefix on the result, tool
#            RUNS anyway. Handy for lab / dev where you want e.g.
#            `subfinder -d example.com` even though only
#            `www.example.com` is in scope. Matches the desktop
#            bughunter-harness default.
#   off    → no gate at all. Tests only. Never against a real target.
scope_enforcement: "strict"

# ─────────── Attribution headers ─────────────────────────────────────
# Sent on every http_get/http_post so the target's SOC can see where the
# traffic comes from. Set your researcher handle here — every platform
# expects some form of "Researcher: <handle>" so triage can correlate.
attribution_headers:
  X-Bug-Bounty-Researcher: "your-handle-here"
  # X-HackerOne-Research: "your-h1-handle"
  # X-Bugcrowd-Research: "your-bc-handle"

# ─────────── OOB (out-of-band) catcher ───────────────────────────────
# The oob_generate_token() tool returns URLs under this host. Point it at
# YOUR OWN OOB infrastructure — never at a third-party service (data would
# leak to whoever runs it). Format returned by the tool:
#   https://<host>/oob/<token_prefix>-<purpose>-<epoch>-<counter>
# `token_prefix` lets you tell hits apart when multiple harnesses share the
# same catcher panel (e.g. "harness" for the desktop pipeline, "lite" for
# this one, "burp" if you also fire OOBs from Burp Collaborator, etc.).
oob:
  host: ""                      # e.g. https://oob.your-domain.example
  token_prefix: "lite"          # keep alnum + '-' / '_'; max 20 chars
